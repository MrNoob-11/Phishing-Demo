[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smart_runner"
version = "0.1.0"
description = "An automated orchestrator for Flask and Cloudflare tunnels"
authors = [
    { name = "Mo" }
]
requires-python = ">=3.7"
dependencies = [
    "flask>=3.0.0"
]

[project.scripts]
run-demo = "smart_runner:main"
launch-web = "app:start_server"
view-logs = "view_database:display_logs"

[tool.setuptools]
py-modules = ["smart_runner", "app", "view_database"]

